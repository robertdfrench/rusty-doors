[package]
name = "door-macros"
version = "0.2.0"
edition = "2021"
authors = ["Robert D. French <robert@robertdfrench.me>"]
description = "Macros for the 'doors' crate"
license = "MPL-2.0"
repository = "https://github.com/robertdfrench/rusty-doors"
documentation = "https://docs.rs/doors"

[lib]
proc-macro = true

[dependencies]
syn = { version = "2.0", features = [
	"full",
	"extra-traits",
	"printing",
	"parsing",
] }
quote = "1"
proc-macro2 = "1"

# `doors` is NOT a dev-dependency. It depends on this crate, so adding
# it back would make a dependency cycle. Everything here is tested by
# calling `expand` directly on token streams (GOALS.md §3.1).
[dev-dependencies]
trybuild = "1"
