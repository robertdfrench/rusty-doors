[package]
name = "doors"
version = "0.9.0"
edition = "2021"
authors = ["Robert D. French <robert@robertdfrench.me>"]
description = "Access the illumos Doors API from Rust"
license = "MPL-2.0"
repository = "https://github.com/robertdfrench/rusty-doors"
documentation = "https://docs.rs/doors"

[features]
default = []
# Enables the `#[door(rpc)]` shape: serde-encoded requests and replies
# with postcard on the wire. Off by default so the base crate stays
# dependency-light. See GOALS.md §3.8.
rpc = ["dep:serde", "dep:postcard"]

[dependencies]
doors-sys = { version = "0.1", path = "../doors-sys" }
door-macros = { version = "0.2", path = "../macros" }
libc = "0.2"
serde = { version = "1", optional = true, default-features = false }
postcard = { version = "1", optional = true, default-features = false, features = [
	"alloc",
] }

[dev-dependencies]
trybuild = "1.0"
# The `kvstore` and `signer` examples derive Serialize/Deserialize and
# call postcard themselves, so they need both crates in their own
# right. The library's copies are optional and behind `rpc`, and an
# example cannot borrow an optional dependency. The optional copy of
# `serde` also has no `derive` feature.
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", default-features = false, features = ["alloc"] }

# A door serving a key-value store with per-group access control, and
# a client to drive it. Gated on `rpc` because they speak the same
# serde-plus-postcard wire format that `#[door(rpc)]` produces.
[[example]]
name = "kvstore"
required-features = ["rpc"]

[[example]]
name = "kvstore_client"
required-features = ["rpc"]

[package.metadata.docs.rs]
all-features = true
default-target = "x86_64-unknown-illumos"
