\* The correct crate: no descriptor is ever released twice, and no
\* thread ever closes a door that has become somebody else's.
CONSTANTS
    Threads = {t1, t2}
    FDs     = {3, 4}
    MaxGen  = 3
    BUGGY   = FALSE

SPECIFICATION Spec

INVARIANT TypeOK
INVARIANT NoAlienClose
INVARIANT NoStaleClose
INVARIANT RegistryHonest
INVARIANT LockDiscipline

\* The state space is bounded by MaxGen on purpose, so running out of
\* moves is expected and says nothing. Only the invariants matter.
CHECK_DEADLOCK FALSE
