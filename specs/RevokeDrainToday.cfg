\* The crate as it stands. The counter is never raised, so the drain
\* loop reads zero and returns at once. The slab still clones an Arc, so
\* nothing is freed under a live call -- but revoke cannot hand back an
\* owned S, which is what GOALS.md 5.1 promises.
CONSTANTS
    Threads   = {t1, t2}
    NumStates = 2
    INCREMENT = "none"
    ARCCLONE  = TRUE
    ORDER     = "drainThenUninstall"

SPECIFICATION Spec

INVARIANT TypeOK
INVARIANT NoUseAfterFree
INVARIANT RevokeGetsOwned
INVARIANT NoCrossTenant

CHECK_DEADLOCK FALSE
