\* The increment in the right place, the Arc clone in place, and the
\* drain still where `Door::revoke` has it: read the counter, then take
\* the state out of the slab. Safe, but not enough to promise an owned S.
CONSTANTS
    Threads   = {t1, t2}
    NumStates = 2
    INCREMENT = "before"
    ARCCLONE  = TRUE
    ORDER     = "drainThenUninstall"

SPECIFICATION Spec

INVARIANT TypeOK
INVARIANT NoUseAfterFree
INVARIANT RevokeGetsOwned
INVARIANT NoCrossTenant

CHECK_DEADLOCK FALSE
