\* Question (a). No increment at all, and no reference taken when the
\* cookie resolves -- so the drain is the only thing keeping the state
\* alive. This is what the world looked like under the old `Pinned`
\* cookie strategy. It must fail.
CONSTANTS
    Threads   = {t1, t2}
    NumStates = 2
    INCREMENT = "none"
    ARCCLONE  = FALSE
    ORDER     = "drainThenUninstall"

SPECIFICATION Spec

INVARIANT TypeOK
INVARIANT NoUseAfterFree
INVARIANT RevokeGetsOwned
INVARIANT NoCrossTenant

CHECK_DEADLOCK FALSE
