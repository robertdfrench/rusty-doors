\* The client re-wraps its Released descriptors on CallError::Consumed as
\* well as on Rejected. It is the natural belief -- "the call failed, so
\* the kernel did not take them" -- and it is true for exactly two errno
\* values out of all of them.
CONSTANTS
    Threads = {t1, t2}
    FDs     = {3, 4}
    MaxGen  = 2
    BUGGY   = TRUE

SPECIFICATION Spec

INVARIANT TypeOK
INVARIANT NoDoubleRelease
INVARIANT NoAlienRelease
INVARIANT OnlyOwnerReleases
INVARIANT NoLeak

\* The state space is bounded by MaxGen on purpose, so running out of
\* moves is expected and says nothing. Only the invariants matter.
CHECK_DEADLOCK FALSE
