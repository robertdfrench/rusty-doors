\* Question (c), continued. Same as RevokeDrainBefore, but the state
\* leaves the slab BEFORE the drain reads the counter. This is the
\* configuration that isolates the ordering answer from the Arc: no
\* reference is taken on resolve, so the drain is the only protection.
CONSTANTS
    Threads   = {t1, t2}
    NumStates = 2
    INCREMENT = "before"
    ARCCLONE  = FALSE
    ORDER     = "uninstallThenDrain"

SPECIFICATION Spec

INVARIANT TypeOK
INVARIANT NoUseAfterFree
INVARIANT RevokeGetsOwned
INVARIANT NoCrossTenant

CHECK_DEADLOCK FALSE
