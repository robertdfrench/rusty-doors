\* The recommendation. Raise the counter BEFORE resolving the cookie,
\* and take the state out of the slab BEFORE draining. Both invariants
\* hold: no use after free, and revoke really does hand back an owned S.
CONSTANTS
    Threads   = {t1, t2}
    NumStates = 2
    INCREMENT = "before"
    ARCCLONE  = TRUE
    ORDER     = "uninstallThenDrain"

SPECIFICATION Spec

INVARIANT TypeOK
INVARIANT NoUseAfterFree
INVARIANT RevokeGetsOwned
INVARIANT NoCrossTenant

\* The state space is bounded by NumStates on purpose, so running out of
\* moves is expected and says nothing. Only the invariants matter.
CHECK_DEADLOCK FALSE
